version: '3.8'

services:
  huawei-sms-gateway:
    build: .
    container_name: huawei_sms_gateway
    restart: unless-stopped
    ports:
      - "5000:5000"   # Webinterface, REST API & Webhook
      - "1025:1025"   # Async SMTP Server
    volumes:
      - ./data:/app/data   # SQLite Datenbank persistent speichern